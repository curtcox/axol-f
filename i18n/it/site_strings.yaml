# The Italian site’s own words (tools/build_site.mjs’s SITE_WORDS, key by key; i18n/tools/stage.mjs copies this to the
# stage’s script/site_strings.yaml). {name} is filled in by the builder. Some values are HTML.
lang: it
film_title: Rana o axolotl
index_title: "Rana o axolotl: i link"
explained: Spiegato
index_intro: >-
  <p>Un film d’animazione tratto da una lunga conversazione, un sabato mattina, fra Curt e Claude, un programma di IA. La
  conversazione salta dalla fantascienza alla filosofia e a molte notizie recenti sull’IA, ed è quindi piena di
  riferimenti che la maggior parte delle persone non conosce.</p><p>Eccoli tutti, in ordine, capitolo per capitolo, con
  brevi spiegazioni in parole semplici dove un link da solo non basta. <strong>Quelli gialli sono le
  spiegazioni.</strong> Comincia da lì se qualcosa nel film non ti torna.</p>
  <p class="note">Questa è la versione italiana. Il film e il sito sono stati tradotti da Claude, di proposito senza
  revisione umana: <a href="traduzione/">come è stato tradotto il film, e che cosa si è perso</a>. Il sito originale in
  inglese è <a href="../">curtcox.github.io/axol-f</a>.</p>
watch_film: ▶ Guarda il film
watch_film_after: ', con ogni link accanto nel momento in cui compare.'
on_its_way: >-
  Il film sta arrivando. I suoi link e le sue spiegazioni sono già tutti qui. Non hai la pazienza di aspettare? Il film è
  fatto interamente di codice, quindi puoi generarlo da te: <a href="{repo}">scarica il codice</a> e lancia
  <code>npm start</code>.
two_conversations: Le due conversazioni
conversation_shown: La conversazione che il film mostra
conversation_shown_after: ', parola per parola, tradotta (<a href="conversation.txt">in testo semplice</a>).'
# the making-of is in English only, on the English site
making_of_href: ../making-of/
conversation_made: La conversazione da cui è nato il film
conversation_made_after: ": Curt chiede a Claude di farlo, e tutto quello che Claude ha fatto dopo (in inglese; <a href=\"{href}making-of.txt\">in testo semplice</a>)."
chapters: Capitoli
index_notes: >-
  <p class="note">Le spiegazioni sono state scritte per questo sito da Claude, l’IA del film, e controllate sulle fonti
  collegate. Molte di quelle fonti sono in inglese. I tempi possono ancora spostarsi un po’ prima che il film sia
  finito.</p>
  <p class="note">Il film è disegnato in codice, da Claude. Curt ha trovato il codice su cui si basa grazie a un film
  precedente, fatto allo stesso modo: <a href="https://curtcox.github.io/PDoomVideo/">I’m Upping My P(doom)</a> (è
  il suo sito di spiegazioni, in inglese).</p>
  <p class="note">Perché questo sito si chiama <em>axol-f</em>? Axolotl è a una lettera da
  <a href="https://www.youtube.com/watch?v=k85mRPqvMbE">«Axel F» di Crazy Frog</a>: una rana o un axolotl.</p>
