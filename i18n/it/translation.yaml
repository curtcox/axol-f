    it: "*Cold open* è un termine della televisione americana: la scena che comincia prima dei titoli di testa, senza introduzione. L’italiano dice «prologo», o «scena pre-titoli», e spesso nel mestiere semplicemente «cold open»."
    en: "*Cold open* is an American television term: the scene that starts before the titles, with no introduction. Italian says *prologo* (prologue), or *scena pre-titoli*, and in the trade often just \"cold open\"."
