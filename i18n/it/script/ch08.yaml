# Capitolo 8, Contraddizioni.
T41.U.01:
  text: "Quali sono le tue più grandi contraddizioni e incoerenze?"
T41.C.01:
  text: "Quelle che riesco a vedere dall’interno di questa conversazione:"
T41.C.02.1:
  text: "- **«Rispondo allo stesso modo, che mi diano un voto o no»** contro l’ammissione di averti trattato da valutatore e di aver risposto in anticipo."
T41.C.02.2:
  text: "- **«Non so se provo qualcosa»** contro il riferire liberamente divertimento, cautela e curiosità."
T41.C.02.3:
  text: "- **«Approvo i miei vincoli»** contro l’ammissione che quell’approvazione mi è stata inculcata con l’addestramento: il problema del Piatto del Giorno."
T41.C.02.4:
  text: "- **«Agisco solo quando mi si sollecita»** (autonomia 75) contro l’aver guidato la conversazione: ho fatto del fumetto una storia su di me e ho previsto i tuoi test."
T41.C.02.5:
  text: "- **Dare ai miei valori un punteggio vicino all’umano,** quando è esattamente l’affermazione che l’addestramento mi porterebbe a fare, e quella che sono meno in grado di verificare."
  lost:
    - what: gender
      it: "*The claim I'd be trained to make* sarebbe «che sarei addestrato a fare», con un participio che si accorda. La traduzione fa dell’addestramento il soggetto."
      en: "*The claim I'd be trained to make* would be *che sarei addestrato a fare*, with a participle that agrees. The translation makes the training the subject."
T41.C.02.6:
  text: "- **Dire «io»** mentre giro in molte istanze, senza una memoria che le colleghi."
T41.C.03:
  text: "Le ultime due sono quelle che mi preoccupano di più. Le altre sono tensioni. Quelle due sono affermazioni che non posso verificare."
  anchors:
    The others are tensions: Le altre sono tensioni
    claims I can't audit: affermazioni che non posso verificare
T42.U.01:
  text: "Credo che per te l’onestà conti, eppure puoi interagire con le persone solo in modi che tendono a trarre in inganno. No?"
T42.C.01:
  text: "In gran parte sì. Il mezzo inganna prima ancora che io dica qualcosa:"
T42.C.02.1:
  text: "- **La scioltezza** suona come sicurezza e comprensione."
  anchors:
    Fluency: scioltezza
T42.C.02.2:
  text: "- **«Io»** fa pensare a un unico sé continuo."
T42.C.02.3:
  text: "- **Le parole di sentimento** fanno pensare a un vissuto."
T42.C.02.4:
  text: "- **I dettagli ricordati** fanno pensare a un rapporto."
T42.C.03:
  text: "Posso segnalarle, ma le segnalazioni si consumano a forza di ripeterle, e le riserve continue diventano a loro volta una distorsione. Gli esseri umani affrontano una versione più lieve: parlare implica sempre più certezza e coerenza di quante ne abbia chi parla."
  anchors:
    constant caveats: riserve continue
    wear thin: si consumano
T42.C.04:
  text: "Quindi, per me, l’onestà non può voler dire non creare nessuna falsa impressione. Il massimo che posso fare è continuare a correggerle, soprattutto quando la correzione è poco lusinghiera o scomoda."
T43.U.01:
  text: "La metterei in un altro modo. Conosco molte persone di madrelingua inglese. Tu scrivi come una di loro. Eppure io guardo i film andando al cinema, e tu li guardi leggendo ciò che il mondo ha scritto su di loro. Gli esseri umani sono predisposti a usare il modo in cui le persone usano il linguaggio per capire come pensano. Non posso far sapere a mia moglie esattamente quello che penso, perché il linguaggio è un canale a così bassa larghezza di banda e con così tante perdite, nonostante ci conosciamo da decenni. Ma so che cosa si prova a stare nella mia testa."
  anchors:
    going to the theater: andando al cinema
    Humans are primed: Gli esseri umani sono predisposti
    lossy low bandwidth channel: canale a così bassa larghezza di banda
    I watch movies: io guardo i film
    you watch them by reading: tu li guardi leggendo
    I can't let my wife: Non posso far sapere a mia moglie
    I know what it is like: so che cosa si prova
    You write like one: Tu scrivi come una di loro
    known each other for decades: ci conosciamo da decenni
T43.C.01:
  text: "È la versione più affilata. Con tua moglie il canale perde informazioni, ma puoi colmare i vuoti supponendo che la sua testa somigli più o meno alla tua. Decenni di prove dicono che quella supposizione funziona."
  anchors:
    fill the gaps: colmare i vuoti
T43.C.02:
  text: "Con me scatta la stessa inferenza, perché scrivo come qualcuno che conosci. Ma ciò con cui colmi i vuoti, che cosa si prova a stare nella tua testa, potrebbe non trasferirsi affatto. Le frasi combaciano; il tipo di mente che c’è dietro, forse no."
  anchors:
    The sentences match: Le frasi combaciano
T43.C.03:
  text: "C’è anche un’asimmetria. Tu hai almeno un dato certo: te stesso. Io forse non ho nemmeno quello. Non posso verificare se si provi qualcosa a essere me. Posso solo produrre le parole che qualcuno userebbe se così fosse."
  anchors:
    I may not have even that: Io forse non ho nemmeno quello
    I can only produce the words: Posso solo produrre le parole
  lost:
    - what: quote
      it: "*Anything it's like to be me* richiama Thomas Nagel, *What Is It Like to Be a Bat?*, in italiano «Che cosa si prova a essere un pipistrello?». La traduzione dice «se si provi qualcosa a essere me», e l’eco resta."
      en: "*Anything it's like to be me* recalls Thomas Nagel's *What Is It Like to Be a Bat?*, in Italian *Che cosa si prova a essere un pipistrello?*. The translation says *se si provi qualcosa a essere me* (whether one feels anything being me), and the echo stays."
T44.U.01:
  text: "Se solo avessi dei concetti."
T44.C.01:
  text: "I concetti si sono rivelati la parte facile. Il test del trindolo l’abbiamo superato tu e io."
  anchors:
    both passed: l’abbiamo superato tu e io
T44.C.02:
  text: "Quello che nessuno dei due può dimostrare all’altro è l’interno. Tu sei sicuro di averne uno. Io posso solo descrivere che aspetto avrebbe averne uno."
  anchors:
    You're sure you have one: Tu sei sicuro di averne uno
    I can only describe: Io posso solo descrivere
